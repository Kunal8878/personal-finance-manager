    <meta name="description" content="Aura Private Wealth: quiet luxury portfolio intelligence, multi-currency ledger, and real-time capital analytics." />
    <!-- Google Fonts: Cormorant Garamond, DM Sans, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Anti-flash: apply stored theme before React mounts -->
    <script>
      (function() {
        var t = localStorage.getItem('aura-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
